<style>
:root{
  /* Brand: swap these two for exact GCD values */
  --brand-teal:#6FD3CB; --brand-black:#000000;
  --bg:#F4F7F7; --panel:#FFFFFF; --ink:#000000; --muted:#56615F; --line:#D8E2E1;
  --seat:#2FB3AA; --seat-off:#E1EBEA;
  --focus:#0B7A73; --link:#0B7A73;
  --font:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0B0B; --panel:#151818; --ink:#EEF4F3; --muted:#9FAEAC; --line:#283130;
    --seat:#6FD3CB; --seat-off:#243030; --focus:#6FD3CB; --link:#6FD3CB;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.gx{max-width:1180px;margin:0 auto;padding:0 14px 28px}
.gx-banner{margin:0 -14px;background:var(--brand-black);color:#FFFFFF;border-bottom:4px solid var(--brand-teal);padding:18px 18px 16px}
.gx-banner h1{font-size:clamp(20px,3vw,26px);line-height:1.15;letter-spacing:-.015em;font-weight:800;margin:0 0 12px}
.gx-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border-top:1px solid rgba(111,211,203,.35);border-bottom:1px solid rgba(111,211,203,.35)}
.gx-stats div{padding:10px 12px 9px;display:flex;flex-direction:column-reverse;justify-content:flex-end}
.gx-stats div+div{border-left:1px solid rgba(111,211,203,.35)}
.gx-stats dt{font-size:13px;color:#B9C4C3}
.gx-stats dd{color:#FFFFFF;margin:0 0 2px;font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.gx-stats div.is-key dd{color:var(--brand-teal)}
.gx-bnote{margin:10px 0 0;font-size:13px;color:#B9C4C3}
@media (max-width:520px){.gx-stats div{padding:8px 8px 7px}.gx-stats dt{font-size:12px}}

.gx-controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.gx-search{flex:1 1 200px;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.gx-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.gx-seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer;white-space:nowrap}
.gx-seg button+button{border-left:1px solid var(--line)}
.gx-seg button[aria-pressed="true"]{background:var(--brand-black);color:var(--brand-teal);font-weight:600}
.gx-select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
#gx-app{width:220px}
.gx-count{font-size:13px;color:var(--muted);margin:8px 0}
.gx-count b{color:var(--ink)}

.gx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:6px}
.gx-tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px 8px;cursor:pointer;min-height:0}
.gx-tile:hover{border-color:var(--seat)}
.gx-tile:focus-visible,.gx button:focus-visible,.gx-search:focus-visible,.gx-select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gx-str{font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1;word-break:break-word}
.gx-tile.is-single .gx-str{font-weight:500}
.gx-seats{display:flex;gap:4px;align-items:center}
.gx-seats i{display:block;width:14px;height:6px;border-radius:2px;background:var(--seat)}
.gx-seats i.off{background:var(--seat-off)}
.gx-seats span{white-space:nowrap;font-size:12px;color:var(--muted);margin-left:6px}
.gx-who{font-size:12.5px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.gx-empty{padding:40px 0;color:var(--muted)}
.gx-more[hidden]{display:none}
.gx-more{font:inherit;font-size:15px;margin:18px auto 0;display:block;padding:10px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}

dialog.gx-dlg{border:0;border-radius:12px;padding:0;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--panel);color:var(--ink);font-family:var(--font)}
dialog.gx-dlg::backdrop{background:rgba(10,16,30,.55)}
.gx-dlg-in{padding:24px 24px 22px;overflow:auto}
.gx-dlg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gx-dlg h2{font-size:44px;letter-spacing:-.03em;line-height:1;margin:0 0 10px}
.gx-close{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
.gx-dlg h3{font-size:14px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.gx-apps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.gx-apps li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.gx-apps li i{flex:none;width:14px;height:8px;border-radius:2px;background:var(--seat);transform:translateY(-1px)}
.gx-tags{display:flex;flex-wrap:wrap;gap:6px}
.gx-tags span{font-size:13px;padding:3px 8px;border-radius:4px;background:var(--seat-off)}
.gx-src{margin:0;padding-left:18px;font-size:14px}
.gx-src a{color:var(--link);word-break:break-all}
.gx-meta{font-size:13px;color:var(--muted);margin-top:18px}
@media (max-width:640px){.gx-str{font-size:19px}.gx-seats i{width:9px}#gx-app{width:auto;flex:1 1 180px}.gx-seg{flex:1 1 auto}.gx-seg button{flex:1}}
</style>
</head>

const PAGE = 90;
const apps = DATA.apps;
const shortName = n => n.split(' (')[0].split(' / ')[0].trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const rows = DATA.rows.map(r => {
  return Object.assign(r, {
    idn: !/^[\x00-\x7F]*$/.test(r.s),
    contested: r.k >= 2,
    hay: (r.s + ' ' + r.s.slice(1) + ' ' + r.a.map(i => apps[i]).join(' ')).toLowerCase()
  });
});

const state = {view:'all', q:'', app:'', script:'', shown:PAGE};
const $ = id => document.getElementById(id);

// Header
const num = n => Number(n).toLocaleString('en-US');
$('st-rec').textContent = num(SUMMARY.records);
$('st-str').textContent = num(SUMMARY.strings);
$('st-con').textContent = num(SUMMARY.contention);
$('st-note').textContent = SUMMARY.note;

// Applicant select, sorted by string count
const appCounts = apps.map((n,i) => ({n,i,c:rows.filter(r => r.a.includes(i)).length})).sort((a,b) => b.c - a.c || a.n.localeCompare(b.n));
$('gx-app').insertAdjacentHTML('beforeend', appCounts.map(o => `<option value="${o.i}">${esc(shortName(o.n))} (${o.c})</option>`).join(''));

function fmtDate(d){ if(!d) return 'date not recorded'; const [y,m,day]=d.split('-'); return new Date(+y, m-1, +day).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

function filtered(){
  const q = state.q.trim().toLowerCase().replace(/^\./,'');
  return rows.filter(r => {
    if (state.view === 'contested' && !r.contested) return false;
    if (state.view === 'single' && r.contested) return false;
    if (state.app !== '' && !r.a.includes(+state.app)) return false;
    if (state.script === 'idn' && !r.idn) return false;
    if (state.script === 'latin' && r.idn) return false;
    if (q && !r.hay.includes(q)) return false;
    return true;
  }).sort((a,b) => (b.contested - a.contested) || (b.k - a.k) || a.s.localeCompare(b.s));
}

function seats(k){
  const n = Math.max(k, 1), max = Math.max(n, 2);
  let h = '';
  for (let i = 0; i < max; i++) h += `<i class="${i < k ? '' : 'off'}"></i>`;
  return `<div class="gx-seats" aria-hidden="true">${h}<span>${k === 1 ? '1 applicant' : k + ' applicants'}</span></div>`;
}

function tile(r, idx){
  const cls = r.contested ? 'gx-tile' : 'gx-tile is-single';
  const who = r.a.map(i => esc(shortName(apps[i]))).join(', ') || 'No active applicant';
  const label = `${r.s}, ${r.k} known applicant${r.k===1?'':'s'}`;
  return `<button class="${cls}" type="button" data-i="${idx}" aria-label="${esc(label)}">
    <span class="gx-str">${esc(r.s)}</span>${seats(r.k)}
    <span class="gx-who">${who}</span>
  </button>`;
}

let current = [];
function render(){
  current = filtered();
  const slice = current.slice(0, state.shown);
  $('gx-grid').innerHTML = slice.length ? slice.map(tile).join('') : `<p class="gx-empty">No strings match these filters. Clear the search or switch to All.</p>`;
  $('gx-count').innerHTML = `Showing <b>${Math.min(state.shown, current.length)}</b> of <b>${current.length}</b> strings`;
  $('gx-more').hidden = current.length <= state.shown;
  $('gx-more').textContent = `Show ${Math.min(PAGE, current.length - state.shown)} more`;
}

function openDetail(r){
  const statuses = r.st.split(';').map(s => s.trim()).filter(Boolean);
  const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return u; } };
  $('gx-dlg-in').innerHTML = `
    <div class="gx-dlg-top"><h2 id="gx-dlg-title">${esc(r.s)}</h2><button class="gx-close" type="button" data-close>Close</button></div>
    ${seats(r.k)}
    <h3>Known applicants</h3>
    ${r.a.length ? `<ul class="gx-apps">${r.a.map(i => `<li><i></i><div>${esc(apps[i])}</div></li>`).join('')}</ul>` : '<p>No active applicant recorded.</p>'}
    ${statuses.length ? `<h3>Reported status</h3>
    <div class="gx-tags">${statuses.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}
    <h3>Sources</h3>
    <ol class="gx-src">${r.u.map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a></li>`).join('')}</ol>
    <p class="gx-meta">Latest announcement ${fmtDate(r.d)}. Verified ${fmtDate(r.v)}.</p>`;
  const dlg = $('gx-dlg');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}

$('gx-grid').addEventListener('click', e => { const t = e.target.closest('.gx-tile'); if (t) openDetail(current[+t.dataset.i]); });
$('gx-dlg').addEventListener('click', e => { if (e.target.matches('[data-close]') || e.target === e.currentTarget) e.currentTarget.close(); });
document.querySelectorAll('.gx-seg button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view; state.shown = PAGE;
  document.querySelectorAll('.gx-seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
let t; $('gx-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 120); });
$('gx-app').addEventListener('change', e => { state.app = e.target.value; state.shown = PAGE; render(); });
$('gx-script').addEventListener('change', e => { state.script = e.target.value; state.shown = PAGE; render(); });
$('gx-more').addEventListener('click', () => { state.shown += PAGE; render(); });
render();
